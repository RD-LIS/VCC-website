<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCC</title>
  <meta name="robots" content="index, nofollow">
  <style>
    /* 기본 리셋 & 화면 중앙 정렬 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 버튼들을 담는 세로 정렬 컨테이너 */
    .link-container {
      width: 100%;
      max-width: 400px; /* 모바일 및 데스크톱 적절 크기 제한 */
      display: flex;
      flex-direction: column;
      gap: 16px; /* 버튼 사이 간격 */
    }

    /* 큼직한 버튼 스타일 */
    .btn {
      display: block;
      width: 100%;
      padding: 18px 24px;
      background-color: #ffffff;
      color: #222222;
      text-decoration: none;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    /* 살짝 떠오르는 호버 효과 */
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      background-color: #ffffff;
      border-color: #d1d5db;
    }

    /* 클릭 시 반응 (터치감) */
    .btn:active {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="link-container">
    <a href="https://richdivine-vcc.com/vcc2025/" class="btn" target="_blank">VCC 2025 바로가기</a>
    <a href="https://richdivine-vcc.com/vcc2024/" class="btn" target="_blank">VCC 2024 바로가기</a>
    <a href="https://richdivine-vcc.com/vcc2023/" class="btn" target="_blank">VCC 2023 바로가기</a>
  </div>

</body>
</html>
